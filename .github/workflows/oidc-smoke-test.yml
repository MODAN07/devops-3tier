name: oidc-smoke-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  assume-role:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC token claims (debug only, remove after fixing)
        run: |
          python3 - <<'EOF'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("sub", "aud", "iss", "repository", "ref"):
              print(k, "=", claims.get(k))
          EOF

      - name: Get temporary AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Who am I?
        run: aws sts get-caller-identity

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2